[theme]
base = "dark"
primaryColor = "#22C55E"
backgroundColor = "#0B1426"
secondaryBackgroundColor = "#101A30"
textColor = "#F1F5F9"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#0A0F1E"
secondaryBackgroundColor = "#101A30"
textColor = "#F1F5F9"

[server]
headless = false
runOnSave = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "developer"
showErrorDetails = true
