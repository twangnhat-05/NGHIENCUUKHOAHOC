[theme]
base = "dark"
primaryColor = "#22C55E"
backgroundColor = "#0B1426"
secondaryBackgroundColor = "#101A30"
textColor = "#F1F5F9"
font = "sans serif"

# Sidebar styling handled via theme.css (Streamlit 1.40 does not support
# the [theme.sidebar] config block — added in newer versions).

[server]
headless = true
runOnSave = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "developer"
showErrorDetails = true
