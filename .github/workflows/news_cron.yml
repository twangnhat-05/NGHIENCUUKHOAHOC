name: news-realtime-refresh

on:
  schedule:
    # Every 4 hours (was every 30 minutes). Slower cadence reduces commit
    # churn on main and keeps a stable baseline for paper reproducibility,
    # while news/tone freshness stays within the same trading day.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}   # manual trigger from the Actions tab

permissions:
  contents: write   # needed to commit the refreshed parquet back

concurrency:
  group: news-realtime
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # Only the deps the news pipeline actually needs — fast install
          pip install pandas pyarrow requests pyyaml defusedxml

      - name: Refresh news cache
        run: python -m scripts.refresh_news_realtime --keep-days 90

      - name: Commit updated parquet (if changed)
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/external/news_realtime.parquet \
                  data/external/gdelt_tone_timeline.parquet 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore(news): auto-refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
